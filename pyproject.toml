[project]
name = "dataclerk"
version = "0.1.0"
description = "问数官 — 双通道校园智能助手（Text-to-SQL + 政策 RAG）+ 体系化测试"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    # 权限层 SQL 解析（行级过滤重写）——硬依赖，agent/guard/permission.py 顶层导入。
    # 第十二轮修复：此前被错误声明为可选 extra（pyproject 注释称「未安装则回退
    # 正则白名单解析」），但实际代码无回退路径：未安装时整个包无法 import，
    # 按 README 主流程 `uv sync --extra dev` 复现会得到 8 个 collection error。
    # 安全组件不应「可选」——回退到正则解析意味着行级过滤强度降级。
    "sqlglot>=25.0",
]

[project.optional-dependencies]
# （sqlparse extra 已并入主依赖，见上）
# 可选：RAGAS / DeepEval（官方点名的 RAG 评测工具，LLM-as-judge）
#
# ⚠️ 安全提示（依赖审计实测）：本组依赖当前存在未修复的已知漏洞。
#    ragas 0.4.3 命中 SSRF（Multi-Modal Faithfulness 模块）；
#    其传递依赖 diskcache 5.6.3 命中**不安全 pickle 反序列化**。
#    截至审计时上游尚未发布修复版本。
#    本项目**默认不使用**该组依赖 —— RAG 评测回退到确定性指标（召回@3 / 忠实度），
#    零 Key 可跑且无该风险。仅在需要官方 RAGAS 分数时临时安装，
#    并避免对不可信输入启用多模态忠实度评测。
rag-eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
    "datasets>=2.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "testsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
